<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>AI-BOT MODERN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">AI-BOT</div>
  <div class="login">
    <button>Login</button>
  </div>
</header>

<!-- MAIN LAYOUT -->
<div class="main-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>History</h3>
    <div id="history">
      <div>Chat 1</div>
      <div>Chat 2</div>
      <div>Chat 3</div>
    </div>
    <button onclick="newChat()">+ New Chat</button>
  </aside>

  <!-- CHAT AREA -->
  <section class="chat">
    <div id="messages" class="messages"></div>
    <div class="input-area">
      <input id="input" placeholder="Shkruaj mesazh..." />
      <button onclick="send()">Send</button>
    </div>
  </section>

  <!-- MODULES -->
  <aside class="modules">
    <div class="module">🌍 Përkthime</div>
    <div class="module">📰 Lajme</div>
    <div class="module">📱 Sociale</div>
    <div class="module">📄 Përmbledhje</div>
    <div class="module">👤 Asistent</div>
  </aside>

</div>

<script src="app.js"></script>
</body>
</html>
