<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>AI-BOT</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="loginScreen">
  <div class="loginBox">
    <h1>AI-BOT</h1>
    <p>Zgjidh gjuhën</p>
    <button onclick="enterApp()">🇦🇱 Shqip</button>
    <button onclick="enterApp()">🇬🇧 English</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="logo.png">
    <span>AI-BOT</span>
  </div>

  <div class="actions">
    <button onclick="newChat()">+ New Chat</button>
    <button>Login</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <div class="sidebar">
    <h3>Chats</h3>
    <div id="history"></div>
  </div>

  <div class="chat">
    <div id="messages" class="messages"></div>

    <div class="inputArea">
      <input id="input" placeholder="Shkruaj mesazh..." />
      <button onclick="send()">➤</button>
    </div>
  </div>

  <div class="modules">
    <div class="card">🌍 Përkthime</div>
    <div class="card">📰 Lajme</div>
    <div class="card">📱 Sociale</div>
    <div class="card">📄 Përmbledhje</div>
    <div class="card">👤 Asistent</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
