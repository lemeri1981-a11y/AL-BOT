<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>Al-BOT</title>
</head>
<body>

<div id="messages"></div>

<input id="input" placeholder="Shkruaj..." />
<button onclick="send()">Dërgo</button>

<script>
const input = document.getElementById("input");

async function send() {
  const text = input.value.trim();
  if (!text) return;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    document.getElementById("messages").innerHTML +=
      "<p>" + data.reply + "</p>";

    input.value = "";

  } catch (err) {
    document.getElementById("messages").innerHTML +=
      "<p>Gabim në server</p>";
  }
}

// 🔥 ENTER FUNKSIONAL (SAFE)
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
