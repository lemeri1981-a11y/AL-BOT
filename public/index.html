<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>Al-BOT</title>
</head>
<body>

<div id="messages"></div>

<input id="input" placeholder="Shkruaj..." />
<button onclick="send()">Dërgo</button>

<script>
async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      message:text
    })
  });

  const data = await res.json();

  document.getElementById("messages").innerHTML +=
    "<p>"+data.reply+"</p>";

  input.value="";
}

// 🔥 ENTER = SEND (SHTESË VETËM KJO)
document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
