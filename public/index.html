<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<title>Al-BOT</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 220px;
  background: #0f1b33;
  color: white;
  padding: 15px;
}

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.msg {
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #2b6fff;
  color: white;
  margin-left: auto;
}

.bot {
  background: #1b2a4a;
  color: white;
}

.input {
  display: flex;
  padding: 10px;
  background: #0f1b33;
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 12px 16px;
  border: none;
  background: #2b6fff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>🔵 Al-BOT</h3>
</div>

<div class="chat">

<div class="messages" id="messages"></div>

<div class="input">
  <input id="input" placeholder="Shkruaj..." />
  <button onclick="send()">Dërgo</button>
</div>

</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  add(text, "user");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  add(data.reply, "bot");
}

function add(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = 999999;
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
