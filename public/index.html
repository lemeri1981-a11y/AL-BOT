<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<title>Al-BOT</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
  background: #0b1d3a;
  color: white;
}

/* SIDEBAR */
#sidebar {
  width: 260px;
  background: #08142b;
  padding: 10px;
  overflow-y: auto;
}

#newChatBtn {
  width: 100%;
  padding: 10px;
  background: #2d6cdf;
  border: none;
  color: white;
  cursor: pointer;
  margin-bottom: 10px;
}

.chat-item {
  padding: 10px;
  background: #14284d;
  margin-bottom: 5px;
  cursor: pointer;
  border-radius: 5px;
}

/* MAIN */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* CHAT BOX */
#messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.msg {
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  max-width: 70%;
  word-wrap: break-word;
}

.user {
  background: #2d6cdf;
  margin-left: auto;
}

.ai {
  background: #1f3b73;
  margin-right: auto;
}

/* INPUT AREA (POSHTE FIXED) */
#inputBox {
  display: flex;
  padding: 10px;
  background: #08142b;
}

#input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  border-radius: 5px;
}

button.send {
  padding: 10px 15px;
  margin-left: 10px;
  background: #2d6cdf;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <button id="newChatBtn" onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div>

<!-- MAIN -->
<div id="main">

  <div id="messages"></div>

  <div id="inputBox">
    <input id="input" placeholder="Shkruaj..." />
    <button class="send" onclick="send()">Dërgo</button>
  </div>

</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats") || "{}");
let currentChat = null;

/* NEW CHAT */
function newChat() {
  currentChat = "chat_" + Date.now();
  chats[currentChat] = [];
  save();
  renderChats();
  renderMessages();
}

/* SELECT CHAT */
function selectChat(id) {
  currentChat = id;
  renderMessages();
}

/* SEND MESSAGE */
async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  if (!currentChat) newChat();

  chats[currentChat].push({ role: "user", text });
  renderMessages();

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  chats[currentChat].push({ role: "ai", text: data.reply });
  renderMessages();
  save();

  input.value = "";
}

/* RENDER MESSAGES */
function renderMessages() {
  const box = document.getElementById("messages");
  box.innerHTML = "";

  if (!currentChat) return;

  chats[currentChat].forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    div.innerText = m.text;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* RENDER CHAT LIST */
function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = id;
    div.onclick = () => selectChat(id);
    list.appendChild(div);
  });
}

/* SAVE */
function save() {
  localStorage.setItem("chats", JSON.stringify(chats));
}

/* ENTER KEY */
document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});

/* INIT */
renderChats();
</script>

</body>
</html>
