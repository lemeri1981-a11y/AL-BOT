<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Al-BOT</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
#sidebar {
  width: 250px;
  background: #111;
  color: white;
  padding: 10px;
  overflow-y: auto;
}

.chat-item {
  padding: 10px;
  background: #222;
  margin-bottom: 5px;
  cursor: pointer;
}

/* MAIN CHAT */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#chatBox {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.user { color: blue; }
.ai { color: green; }

#inputBox {
  display: flex;
}

input {
  flex: 1;
  padding: 10px;
}

button {
  padding: 10px;
}
</style>
</head>

<body>

<div id="sidebar">
  <button onclick="newChat()">+ New Chat</button>
  <div id="chatList"></div>
</div>

<div id="main">
  <div id="chatBox"></div>

  <div id="inputBox">
    <input id="msg" placeholder="Shkruaj...">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem("chats")) || {};
let currentChat = null;

function newChat() {
  currentChat = "chat_" + Date.now();
  chats[currentChat] = [];
  save();
  renderChats();
  renderChat();
}

function selectChat(id) {
  currentChat = id;
  renderChat();
}

function send() {
  const input = document.getElementById("msg");
  const text = input.value;
  if (!text) return;

  if (!currentChat) newChat();

  chats[currentChat].push({ role: "user", text });
  renderChat();

  fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  })
  .then(r => r.json())
  .then(data => {
    chats[currentChat].push({ role: "ai", text: data.reply });
    renderChat();
    save();
  });

  input.value = "";
}

function renderChat() {
  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  if (!currentChat) return;

  chats[currentChat].forEach(m => {
    const div = document.createElement("div");
    div.className = m.role;
    div.innerText = (m.role === "user" ? "You: " : "AI: ") + m.text;
    box.appendChild(div);
  });
}

function renderChats() {
  const list = document.getElementById("chatList");
  list.innerHTML = "";

  Object.keys(chats).forEach(id => {
    const div = document.createElement("div");
    div.className = "chat-item";
    div.innerText = id;
    div.onclick = () => selectChat(id);
    list.appendChild(div);
  });
}

function save() {
  localStorage.setItem("chats", JSON.stringify(chats));
}

renderChats();
</script>

</body>
</html>
